<style>
  /* ============================================
     Smooth scroll + sticky nav offset
     ============================================ */
  html {
    scroll-behavior: smooth;
    scroll-padding-top: 80px;
  }

  .masthead {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff;
  }

  /* Underline on the currently visible section's nav item */
  .greedy-nav .visible-links a.is-current {
    border-bottom: 2px solid currentColor;
    padding-bottom: 2px;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') return;

    var sections = document.querySelectorAll('section[id]');
    var navLinks = document.querySelectorAll('.greedy-nav .visible-links a');
    if (sections.length === 0 || navLinks.length === 0) return;

    function clearCurrent() {
      navLinks.forEach(function (link) { link.classList.remove('is-current'); });
    }

    function setCurrent(id) {
      clearCurrent();
      navLinks.forEach(function (link) {
        if (link.getAttribute('href') && link.getAttribute('href').endsWith('#' + id)) {
          link.classList.add('is-current');
        }
      });
    }

    var observer = new IntersectionObserver(function (entries) {
      var visible = entries
        .filter(function (e) { return e.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (visible.length > 0) {
        setCurrent(visible[0].target.id);
      }
    }, {
      rootMargin: '-80px 0px -60% 0px',
      threshold: 0
    });

    sections.forEach(function (s) { observer.observe(s); });
  });
</script>
