# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# Site settings
title: "Rolando Miranda"
email: rolomiranda98@gmail.com
description: >-
  Mechanical engineer working at the intersection of medical device
  manufacturing, mechatronics, and thermal systems. MS candidate at NYU Tandon.
github_username: rolando-miranda
minimal_mistakes_skin: "default"
search: true

# URL settings
url: "https://rolando-miranda.github.io"
baseurl: ""
repository: "rolando-miranda/rolando-miranda.github.io"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/New_York

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author profile (the left sidebar across the site)
author:
  name        : "Rolando Miranda"
  avatar      : "/assets/images/bio-photo.jpeg"
  bio         : "Mechanical engineer · MS candidate at NYU Tandon. Medical devices, mechatronics, thermal systems."
  location    : "Bronx, NY"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:rolomiranda98@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rolando-miranda"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rolando-miranda-engineer"  # <-- add your LinkedIn slug

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rolando-miranda"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rolando-miranda-engineer"  # <-- same LinkedIn URL as above
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:rolomiranda98@gmail.com"

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:path/

# Defaults: layout settings for different content types
defaults:
  # _posts (blog scaffolding — present but unlinked for now)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: false
      read_time: false
      toc: true
      toc_sticky: true

# Archive page configs (left in for future use; not linked in nav)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
